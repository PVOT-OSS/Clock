PackageName: org.prauga.clock
Name: Clock
Summary: Alarms, timers, a stopwatch, world clocks and bedtime
License: Apache-2.0
AuthorName: Saalim Quadri
SourceCode: https://github.com/PVOT-OSS/Clock
IssueTracker: https://github.com/PVOT-OSS/Clock/issues
Categories:
  - Clock
CurrentVersion: "1.0.0"
CurrentVersionCode: 10000
Description: |
  Clock is an alarm clock with timers, a stopwatch, world clocks and a
  bedtime routine. Alarms can repeat, ring once on a date or pause for a
  holiday, with your own sounds, a sunrise before they ring, and warnings
  when settings could keep them from ringing. Run several timers, time laps,
  follow cities around the world, and wind down with a bedtime reminder,
  Do Not Disturb and sleep sounds made on the phone. No ads, no tracking and
  no internet permission.

RepoType: git
Repo: https://github.com/PVOT-OSS/Clock.git

